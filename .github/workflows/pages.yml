name: Validate deploy and verify Evercade Next

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/config.js
      - run: node --check src/catalog.js
      - run: node --check src/eventlog.js
      - run: node --check src/debug.js
      - run: node --check src/endpoint-test.js
      - run: node --check src/parser-client.js
      - run: node --check src/offer-guard.js
      - run: node --check src/app.js
      - run: node --check src/sprite-1.5-00.js
      - run: node --check src/sprite-1.5-01.js
      - run: node --check src/sprite-1.5-02.js
      - run: node --check src/sprite-1.5-03.js
      - run: node --check src/sprite-1.5-04.js
      - run: node --check src/ui-1.5.js
      - run: node --check src/ui-1.6.js
      - run: node --check sw.js
      - run: node --check scripts/smoke.mjs
      - run: node scripts/validate.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e "const fs=require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('VERSION.json','utf8')).version)")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Verify public deployment
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/smoke.mjs
      - name: Verify public 1.6 UI and PWA
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          html="$(curl -fsSL "${PAGES_URL%/}/?t=$(date +%s)")"
          loader="$(curl -fsSL "${PAGES_URL%/}/src/release-loader.js?t=$(date +%s)")"
          manifest="$(curl -fsSL "${PAGES_URL%/}/manifest.webmanifest?t=$(date +%s)")"
          printf '%s' "$html" | grep -q 'data-view="queue">Suche</button>'
          printf '%s' "$html" | grep -q 'id="dealSearch"'
          printf '%s' "$html" | grep -q 'id="dealFilterSeries"'
          printf '%s' "$html" | grep -q 'apple-touch-icon'
          printf '%s' "$loader" | grep -q 'src/ui-1.5.js'
          printf '%s' "$loader" | grep -q 'src/ui-1.6.js'
          printf '%s' "$loader" | grep -q 'src/sprite-1.5-04.js'
          printf '%s' "$manifest" | grep -q '"name": "Evercade"'
          curl -fsSL -o /dev/null "${PAGES_URL%/}/sw.js?t=$(date +%s)"
          curl -fsSL -o /dev/null "${PAGES_URL%/}/icons/icon-180.png"
          curl -fsSL -o /dev/null "${PAGES_URL%/}/icons/icon-512.png"
          echo "Evercade Next 1.6.0 UI and PWA assets are live."
