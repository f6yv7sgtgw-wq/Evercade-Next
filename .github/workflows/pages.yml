name: Normalize and deploy Evercade Next 1.5.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  normalize_validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize and normalize canonical 1.5.0 source tree
        run: bash scripts/normalize-1.5.sh
      - run: node --check src/config.js
      - run: node --check src/catalog.js
      - run: node --check src/eventlog.js
      - run: node --check src/debug.js
      - run: node --check src/endpoint-test.js
      - run: node --check src/parser-client.js
      - run: node --check src/offer-guard.js
      - run: node --check src/app.js
      - run: node --check scripts/smoke.mjs
      - run: node scripts/validate.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: normalize_validate
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify public VERSION.json and 1.5.0 UI markers
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          for i in {1..12}; do
            version="$(curl -fsSL "${PAGES_URL%/}/VERSION.json?t=$(date +%s)" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))' || true)"
            html="$(curl -fsSL "${PAGES_URL%/}/?t=$(date +%s)" || true)"
            if [ "$version" = "1.5.0" ] && printf '%s' "$html" | grep -q 'data-view="queue">Suche</button>'; then
              echo "Evercade Next 1.5.0 is live."
              exit 0
            fi
            echo "Waiting for Pages propagation: version=$version"
            sleep 10
          done
          echo "Public Pages verification failed."
          exit 1